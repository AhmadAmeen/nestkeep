name: nestkeep
description: "NestKeep — home maintenance plan, warranty vault, receipt scanner and reminders."
publish_to: "none"
version: 1.5.1+19

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  google_sign_in: ^7.2.0
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.2.1
  image: 4.5.4
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.0
  pdf: ^3.11.3
  share_plus: ^12.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tasks.json
    - assets/icon.png
