# NestKeep release build — runs on GitHub Actions because the local VM's
# network guard blocks the Gradle daemon (Java loopback). The AAB is built
# here and signed with the upload keystore locally after download, so no
# signing secrets live in GitHub.
name: Build NestKeep AAB

on:
  workflow_dispatch:
  push:
    branches:
      - app-build
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Regenerate Gradle wrapper (jar is not in the repo snapshot)
        working-directory: app/android
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type all

      - name: Generate launcher icons
        run: |
          pip install pillow
          python3 tools/make_icons.py

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build AAB
        working-directory: app
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestkeep-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
