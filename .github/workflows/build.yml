# NestKeep release build — runs on GitHub Actions because the local VM's
# network guard blocks the Gradle daemon (Java loopback). Builds a signed
# AAB using the upload keystore stored in repo secrets:
#   KEYSTORE_BASE64 (base64 of upload-keystore.jks)
#   KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
name: Build NestKeep AAB

on:
  workflow_dispatch:
  push:
    branches:
      - app-build
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Regenerate Gradle wrapper (jar is not in the repo snapshot)
        working-directory: app/android
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type all

      - name: Generate launcher icons
        run: |
          pip install pillow
          python3 tools/make_icons.py

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/upload-keystore.jks
          cat > keystore/key.properties <<KP
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          KP

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build signed AAB
        working-directory: app
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestkeep-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
