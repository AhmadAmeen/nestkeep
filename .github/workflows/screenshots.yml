# NestKeep store screenshots — boots an Android emulator on GitHub Actions,
# installs a debug build of the real app, walks onboarding and captures the
# main screens. Manual trigger only.
name: NestKeep screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Regenerate Gradle wrapper (jar is not in the repo snapshot)
        working-directory: app/android
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type all

      - name: Generate launcher icons
        run: |
          pip install pillow
          python3 tools/make_icons.py

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Run app on emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/screenshot_run.py app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestkeep-screenshots
          path: screenshots/
          retention-days: 30
